name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-verify-release:
    name: Build, Verify & Release Windows Desktop
    runs-on: windows-latest
    env:
      NODE_ENV: production
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Install Root & Workspace Dependencies
        run: npm ci || npm install

      - name: Run Complete Automated Test Suites
        run: npm run test:all

      - name: Build All Workspace Packages (Contracts, Server, Cloud, Web)
        run: npm run build:all

      - name: Build Production Tauri Desktop Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Sign Windows Executable (Production Authenticode)
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $certPath = "$env:TEMP\valorecon_cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          & signtool.exe sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/valorecon.exe
          Remove-Item -Force $certPath

      - name: Generate Signed Updater Manifest (Ed25519)
        run: node scripts/generate-update-manifest.js

      - name: Run Update Security & Tampering Resistance Tests
        run: node scripts/test-update-security.js

      - name: Run Clean-Install Sandbox Validation Procedure
        run: node scripts/validate-release-install.js

      - name: Generate Software Bill of Materials (SBOM)
        run: node scripts/generate-sbom.js

      - name: Generate SHA-256 Checksums
        run: node scripts/generate-checksums.js

      - name: Stage Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release
          Copy-Item src-tauri/target/release/valorecon.exe dist/release/valorecon.exe
          Copy-Item dist/update.json dist/release/update.json
          Copy-Item dist/sbom.json dist/release/sbom.json
          Copy-Item dist/SHA256SUMS.txt dist/release/SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/release/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ValoRecon ${{ github.ref_name || inputs.version }}
          body: |
            ## ValoRecon Production Release (${{ github.ref_name || inputs.version }})
            
            ### Artifacts & Integrity
            - **Desktop Client:** `valorecon.exe` (Windows x64 Native Desktop Application)
            - **Update Manifest:** `update.json` (Signed with Ed25519)
            - **Software Bill of Materials:** `sbom.json` (CycloneDX 1.5 Specification)
            - **Cryptographic Checksums:** `SHA256SUMS.txt`
            
            ### Verification
            All release binaries are verified against the automated test suite (66/66 passing tests) and clean-install sandbox isolation.
          files: |
            dist/release/valorecon.exe
            dist/release/update.json
            dist/release/sbom.json
            dist/release/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
