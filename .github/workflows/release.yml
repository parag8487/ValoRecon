name: Release ValoRecon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --prefix packages/contracts
          npm install --prefix server
          npm install --prefix packages/cloud
          npm install --prefix web

      - name: Run Test Suites
        run: |
          npm test --prefix packages/contracts
          npm test --prefix server
          npm test --prefix packages/cloud

      - name: Build All Packages
        run: |
          npm run build --prefix packages/contracts
          npm run build --prefix server
          npm run build --prefix packages/cloud
          npm run build --prefix web

      - name: Generate Update Manifest
        run: node scripts/generate-update-manifest.js
