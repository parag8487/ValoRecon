apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: valorecon
  labels:
    app: valorecon
spec:
  rules:
    - host: valorecon.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valorecon
                port:
                  number: 80
