apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: valorecon-staging
resources:
  - ../../../k8s
labels:
  - pairs:
      environment: staging
configMapGenerator:
  - name: valorecon-config
    literals:
      - APP_ENV=staging
      - PORT=8799
      - HOST=0.0.0.0
      - LOG_LEVEL=info
